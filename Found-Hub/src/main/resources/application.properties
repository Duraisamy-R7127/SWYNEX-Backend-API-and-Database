spring.application.name=Lost-Found-Hub
server.port=8080

# ---------- MySQL (override with environment variables) ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lostfoundhub}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Durai@0730

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Multipart upload limits ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- JWT (MUST be set via JWT_SECRET in real use; min 32 characters) ----------
app.jwt.secret=${JWT_SECRET:change-this-placeholder-secret-key-min-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- Image storage (folder is outside src/, created automatically) ----------
app.file.upload-dir=${UPLOAD_DIR:uploads}
app.file.max-size-bytes=5242880

# ---------- CORS (for a future frontend) ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

# ---------- First admin account (created at startup if the email does not exist) ----------
app.admin.name=${ADMIN_NAME:System Admin}
app.admin.email=${ADMIN_EMAIL:admin@lostfoundhub.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
